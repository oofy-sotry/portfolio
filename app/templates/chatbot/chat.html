{% extends "base.html" %}

{% block title %}챗봇{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-robot"></i> AI 챗봇
                    </h4>
                </div>
                <div class="card-body">
                    <!-- 챗봇 메시지 영역 -->
                    <div id="chat-messages" class="chat-messages" style="height: 400px; overflow-y: auto; border: 1px solid #dee2e6; padding: 15px; margin-bottom: 20px; border-radius: 8px;">
                        <div class="message bot-message">
                            <div class="message-content">
                                <strong>AI 챗봇:</strong> 안녕하세요! 무엇을 도와드릴까요? 😊
                            </div>
                            <small class="text-muted">방금 전</small>
                        </div>
                    </div>
                    
                    <!-- 메시지 입력 폼 -->
                    <form id="chat-form">
                        <div class="input-group">
                            <input type="text" class="form-control" id="user-message" placeholder="메시지를 입력하세요..." required>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> 전송
                            </button>
                        </div>
                    </form>
                    
                    <!-- 고급 기능 버튼 -->
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('chatbot.advanced_chat') }}" class="btn btn-outline-primary">
                            <i class="fas fa-cog"></i> 고급 챗봇
                        </a>
                        <a href="{{ url_for('chatbot.faq') }}" class="btn btn-outline-info">
                            <i class="fas fa-question-circle"></i> FAQ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.chat-messages {
    background-color: #f8f9fa;
}

.message {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 8px;
}

.bot-message {
    background-color: #e3f2fd;
    margin-right: 20%;
}

.user-message {
    background-color: #007bff;
    color: white;
    margin-left: 20%;
    text-align: right;
}

.message-content {
    margin-bottom: 5px;
}

.typing-indicator {
    display: none;
    color: #6c757d;
    font-style: italic;
}
</style>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/chatbot-page.js') }}"></script>
{% endblock %}
